<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/output.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body
    class="bg-slate-950 text-slate-800 min-h-screen flex items-center justify-center p-4"
  >
    <!-- Light Main Card Container -->
    <main
      class="w-full max-w-sm bg-slate-50 border border-slate-200 rounded-2xl shadow-2xl p-6 relative overflow-hidden"
    >
      <!-- Header Section -->
      <div class="text-center mb-5">
        <h1
          id="form-title"
          class="text-2xl font-bold tracking-tight text-slate-900 mb-1"
        >
          Welcome Back
        </h1>
        <p id="form-subtitle" class="text-xs text-slate-500">
          Please enter your details to sign in.
        </p>
      </div>

      <!-- Light Toggle Switcher Control -->
      <div
        class="relative bg-slate-100 p-1 rounded-xl flex items-center mb-5 border border-slate-200"
      >
        <div
          id="toggle-bg"
          class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-blue-600 rounded-lg shadow-sm"
        ></div>
        <button
          id="btn-login-tab"
          type="button"
          class="relative z-10 w-1/2 py-1.5 text-xs font-semibold text-white text-center transition-colors duration-200"
        >
          Sign In
        </button>
        <button
          id="btn-signup-tab"
          type="button"
          class="relative z-10 w-1/2 py-1.5 text-xs font-semibold text-slate-600 text-center transition-colors duration-200 hover:text-slate-900"
        >
          Sign Up
        </button>
      </div>

      <!-- Form Container -->
      <div id="form-container" class="relative">
        <!-- LOGIN FORM -->
        <form id="login-form" class="space-y-3.5">
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 mb-1"
              for="login-email"
              >Email Address</label
            >
            <input
              type="email"
              id="login-email"
              required
              placeholder="name@company.com"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label
                class="block text-xs font-semibold text-slate-700"
                for="login-password"
                >Password</label
              >
              <a
                href="#"
                id="forgot-password-link"
                class="text-[11px] text-blue-600 hover:text-blue-700 font-semibold transition-colors"
                >Forgot password?</a
              >
            </div>
            <input
              type="password"
              id="login-password"
              required
              placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <!-- Unverified Email Alert Banner -->
          <div
            id="unverified-banner"
            class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800"
          >
            <div class="flex items-start gap-2.5">
              <div
                class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-amber-100"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="w-3.5 h-3.5 text-amber-700"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 9v4m0 4h.01M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"
                  />
                </svg>
              </div>

              <div class="min-w-0">
                <p class="text-xs font-semibold text-amber-900">
                  Email not verified
                </p>

                <p class="mt-0.5 text-[11px] leading-relaxed text-amber-700">
                  Please verify your email before continuing.
                </p>

                <button
                  type="button"
                  id="resend-verification-btn"
                  class="mt-2 inline-flex items-center gap-1.5 text-[11px] font-semibold text-amber-700 hover:text-amber-900 hover:underline transition-all duration-200 active:scale-[0.98]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    class="w-3.5 h-3.5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"
                    />
                  </svg>

                  Resend Verification Email
                </button>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md shadow-blue-600/20 transition-all duration-200 active:scale-[0.98] mt-1 text-xs"
          >
            Sign In
          </button>
        </form>

        <!-- SIGN UP FORM -->
        <form
          id="signup-form"
          class="space-y-3.5 absolute top-0 left-0 w-full opacity-0 pointer-events-none"
        >
          <div>
            <label
              class="block text-xs font-semibold text-slate-700 mb-1"
              for="signup-name"
              >Full Name</label
            >
            <input
              type="text"
              id="signup-name"
              required
              placeholder="Alex Mercer"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-slate-700 mb-1"
              for="signup-email"
              >Email Address</label
            >
            <input
              type="email"
              id="signup-email"
              required
              placeholder="name@company.com"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-slate-700 mb-1"
              for="signup-password"
              >Password</label
            >
            <input
              type="password"
              id="signup-password"
              required
              placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-slate-700 mb-1"
              for="signup-confirm-password"
              >Confirm Password</label
            >
            <input
              type="password"
              id="signup-confirm-password"
              required
              placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 focus:bg-white transition-all duration-200"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md shadow-blue-600/20 transition-all duration-200 active:scale-[0.98] mt-1 text-xs"
          >
            Create Account
          </button>
        </form>
      </div>

      <!-- Social Provider Button -->
      <div class="mt-4 pt-4 border-t border-slate-200">
        <button
          type="button"
          id="google-auth-btn"
          class="w-full flex items-center justify-center gap-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 font-semibold py-2 px-4 rounded-lg transition-all duration-200 active:scale-[0.98] text-xs shadow-sm"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path
              fill="#EA4335"
              d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"
            />
            <path
              fill="#4285F4"
              d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"
            />
            <path
              fill="#FBBC05"
              d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"
            />
            <path
              fill="#34A853"
              d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"
            />
          </svg>
          <span id="google-btn-text">Continue with Google</span>
        </button>
      </div>

      <!-- Footer Switcher -->
      <div class="text-center mt-4 text-xs text-slate-500">
        <span id="footer-text">Don't have an account?</span>
        <button
          type="button"
          id="footer-toggle-btn"
          class="text-blue-600 hover:text-blue-700 font-semibold ml-1 transition-colors"
        >
          Sign up
        </button>
      </div>
    </main>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!--js file-->
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
